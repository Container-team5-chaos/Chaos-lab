# 시세 stub — 업비트 수집기(C)가 준비되기 전까지 사용
# 수집기와 같은 방식으로 1초마다 기록한다 (ChaoStock 실시간 시세 다이어그램)
#   SET     price:KRW-BTC {"price": "<문자열>", "ts": <epoch ms>}   ← 주문 서비스가 읽음
#   PUBLISH price:KRW-BTC <같은 값>                                  ← 푸시 서버가 구독
#
# 안전장치
# - stub이 마지막으로 쓴 값과 다른 신선한 시세(5초 이내)가 보이면 수집기가 있다고 보고 스스로 멈춘다.
#   멈춘 뒤에는 수집기가 죽어도 대신 쓰지 않는다 → 수집기 장애가 stub에 가려지지 않음
# - 시작 시 6초 기다린다 → 재시작 직후 자기가 쓴 직전 값을 수집기 값으로 착각하지 않음
# - Redis 호출마다 3초 타임아웃, 15초 넘게 쓰지 못하면 liveness probe가 재시작
#
# 수집기가 배포되면 삭제: PRICE_STUB=0 infra/local/up.sh
apiVersion: apps/v1
kind: Deployment
metadata:
  name: price-stub
  namespace: exchange
spec:
  replicas: 1
  strategy:
    type: Recreate # stub 두 개가 동시에 쓰지 않게
  selector:
    matchLabels:
      app: price-stub
  template:
    metadata:
      labels:
        app: price-stub
        chaos.exchange/protected: "true"
    spec:
      containers:
        - name: price-stub
          image: redis:7-alpine
          env:
            - name: MARKET
              value: KRW-BTC
            - name: START_PRICE
              value: "95000000"
          command: ["sh", "-c"]
          args:
            - |
              KEY="price:$MARKET"
              rc() { timeout 3 redis-cli -h redis "$@" 2>/dev/null; }
              date +%s > /tmp/last_ok
              sleep 6
              price="$START_PRICE"
              last=""
              while true; do
                # Redis 서버 시각(초, 마이크로초)으로 ms 단위 ts를 만든다
                set -- $(rc TIME)
                if [ -n "${1:-}" ] && [ -n "${2:-}" ]; then
                  ts=$(( $1 * 1000 + $2 / 1000 ))
                  cur="$(rc GET "$KEY")"
                  if [ -n "$cur" ] && [ "$cur" != "$last" ]; then
                    cur_ts=$(printf '%s' "$cur" | sed -nE 's/.*"ts": *([0-9]+).*/\1/p')
                    if [ -n "$cur_ts" ] && [ $(( ts - cur_ts )) -lt 5000 ]; then
                      echo "다른 쓰기 주체의 시세 감지: $cur → stub 중지"
                      touch /tmp/yielded
                      exec sleep 2147483647
                    fi
                  fi
                  # ±0.1% 이내로 무작위 변동
                  price=$(awk -v p="$price" -v s="$RANDOM" 'BEGIN{srand(s); printf "%d", p*(1+(rand()-0.5)/500)}')
                  value="{\"price\": \"$price\", \"ts\": $ts}"
                  if rc SET "$KEY" "$value" >/dev/null; then
                    last="$value"
                    rc PUBLISH "$KEY" "$value" >/dev/null
                    date +%s > /tmp/last_ok
                  fi
                fi
                sleep 1
              done
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - '[ -f /tmp/yielded ] || [ $(( $(date +%s) - $(cat /tmp/last_ok 2>/dev/null || echo 0) )) -lt 15 ]'
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
