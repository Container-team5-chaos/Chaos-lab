apiVersion: v1
kind: Service
metadata:
  name: push-server
  namespace: exchange
  labels:
    app: push-server
spec:
  selector:
    app: push-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: push-server
  namespace: exchange
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: push-server
  template:
    metadata:
      labels:
        app: push-server
        chaos.exchange/protected: "true"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: push-server
          image: chaos-lab-push-server:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REDIS_URL
              value: redis://redis.exchange.svc.cluster.local:6379/0
            - name: MARKET
              value: KRW-BTC
            - name: STALE_MS
              value: "5000"
            - name: MAX_CLIENTS
              value: "1000"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
