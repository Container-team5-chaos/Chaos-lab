# PostgreSQL — 주문, 잔고, 시세 기록
# 접속: postgres.exchange.svc.cluster.local:5432  (user/password/db = exchange, 로컬 전용)
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: exchange
type: Opaque
stringData:
  POSTGRES_USER: exchange
  POSTGRES_PASSWORD: exchange
  POSTGRES_DB: exchange
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: exchange
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: exchange
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        # 정합성 판정 기준이 되는 저장소이므로 장애 주입 대상에서 제외
        chaos.exchange/protected: "true"
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
