# Redis — 현재가 캐시 {price, ts}
# 접속: redis.exchange.svc.cluster.local:6379
# 시세는 수집기가 계속 다시 채우므로 영속화하지 않음
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: exchange
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        chaos.exchange/protected: "true"
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
