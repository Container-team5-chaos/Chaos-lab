# 데모 화면 nginx 설정 (ConfigMap web-nginx → /etc/nginx/conf.d/default.conf)
# 같은 주소에서 화면·주문 API·시세 WebSocket을 함께 내보낸다 → 주문 서비스에 CORS 설정이 필요 없음
#   /       → index.html
#   /api/*  → 주문 서비스 (D)          order.exchange:8000
#   /ws     → 푸시 서버 (C)             push-server.exchange:8080
#
# upstream을 변수로 두어 nginx 시작 시점에 주문 서비스·푸시 서버가 없어도 화면은 뜬다.
# (변수 proxy_pass는 resolver가 필요하고, resolver는 검색 도메인을 쓰지 않으므로 FQDN을 쓴다)
server {
    listen 8080;
    server_name _;

    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        set $order_upstream http://order.exchange.svc.cluster.local:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $order_upstream;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location /ws {
        set $push_upstream http://push-server.exchange.svc.cluster.local:8080;
        proxy_pass $push_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
