# 임시 푸시 서버 (E) — Redis price:KRW-BTC 구독 → 브라우저 WebSocket
# C의 푸시 서버가 배포되면 삭제: kubectl -n exchange delete -f web/k8s/dev-push.yaml
apiVersion: v1
kind: Service
metadata:
  name: dev-push
  namespace: exchange
  labels:
    app: dev-push
spec:
  selector:
    app: dev-push
  ports:
    - name: ws
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-push
  namespace: exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev-push
  template:
    metadata:
      labels:
        app: dev-push
        # 데모 화면용 도구라 장애 주입 대상에서 제외
        chaos.exchange/protected: "true"
    spec:
      containers:
        - name: dev-push
          image: chaos-lab-dev-push:dev
          imagePullPolicy: IfNotPresent # kind에 직접 넣은 이미지 사용
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: MARKET
              value: KRW-BTC
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
