# 데모 화면 (E) — nginx가 index.html과 /api, /ws 프록시를 함께 제공
# ConfigMap web-html(index.html), web-nginx(nginx.conf)는 web/deploy-local.sh가 만든다
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: exchange
  labels:
    app: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        chaos.exchange/protected: "true"
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine # root 없이 8080에서 실행
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: html
          configMap:
            name: web-html
        - name: conf
          configMap:
            name: web-nginx
            items:
              - key: nginx.conf
                path: default.conf
