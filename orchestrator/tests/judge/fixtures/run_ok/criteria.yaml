# 오프라인 e2e 픽스처 기준(test_pipeline_offline.py). 실제 default.yaml을 상속하고 작은 run에 맞게 표본 기준만 낮춘다
extends: ../../../../../experiments/criteria/default.yaml
phases: {warmup: 2s}
coverage: {min_filled: {tail: 5, steady: 5}, min_sell_filled: 2}
