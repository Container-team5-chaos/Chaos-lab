[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
k8s = ["kubernetes>=29", "redis>=5"]
dev = ["pytest"]

[project.scripts]
chaos-judge = "orchestrator.judge.__main__:main"
orchestrator = "orchestrator.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"orchestrator.judge" = ["sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "pg: 로컬 docker postgres가 필요한 테스트",
    "k6: 로컬 k6가 필요한 테스트",
    "e2e: docker로 실제 주문 서비스(workloads/order)를 띄우는 테스트(CI 제외)",
]
