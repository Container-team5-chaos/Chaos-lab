[project]
name = "orchestrator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
k8s = ["kubernetes>=29"]
dev = ["pytest"]

[project.scripts]
orchestrator = "orchestrator.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
