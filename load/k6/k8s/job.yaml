# k6 주문 부하 Job 템플릿(설계 4.8). runner(또는 judge plan)가 아래 자리표시자(달러 + 중괄호)만 채운다. 그대로 apply하지 않는다.
#
# 채울 값(괄호는 우리 설정값)
#   RUN_ID              소문자·숫자·하이픈 3–40자. Job 이름 k6-<RUN_ID>와 주문 키 k6-<RUN_ID>-<vu>-<seq>에 들어간다
#   K6_IMAGE            mirror/k6:2.3.0(팀 인프라 확인 필요). sh, date가 있어야 한다
#   PROFILE ACCOUNTS USER_BASE RATE DURATION_S SPIKE_AT_S THRESHOLDS RUN_SEED   빈 값이면 orders.js 기본값
#   HOLD_S              setupTimeout 180 + 프로파일 길이 + gracefulStop 60 + 수집 예산 600
#   DEADLINE            HOLD_S + 120
#   DISRUPT_ANNOTATION  {}. 리허설·시연만 {karpenter.sh/do-not-disrupt: "true"}
#   ANTI_AFFINITY       {podAntiAffinity: {preferredDuringSchedulingIgnoredDuringExecution: [{weight: 100,
#                         podAffinityTerm: {labelSelector: {matchLabels: {app.kubernetes.io/name: order}},
#                         topologyKey: kubernetes.io/hostname}}]}}   주문 서비스 Pod와 떨어뜨린다
#
# 스크립트는 ConfigMap k6-scripts로 넣는다(load/k6/ 최상위 파일만, k8s/는 들어가지 않는다. 설계 2):
#   kubectl -n exchange create configmap k6-scripts --from-file=load/k6/ --dry-run=client -o yaml | kubectl apply -f -
# 금지: fetch 전에 Job 삭제(emptyDir 기록이 사라진다), 같은 RUN_ID로 다시 apply(같은 키가 다시 나간다)
# WS 부하(k6-ws 컨테이너, ws.js)는 ws.js가 생기면 이 Pod에 더한다(설계 4.9).
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-${RUN_ID}
  namespace: exchange
  labels:
    app.kubernetes.io/name: k6
    chaos/run-id: "${RUN_ID}"
spec:
  backoffLimit: 0 # Pod가 다시 뜨면 새 emptyDir라 앞 기록이 없고 같은 키가 다시 나간다
  podFailurePolicy:
    rules:
      - action: FailJob
        onPodConditions:
          - type: DisruptionTarget
  activeDeadlineSeconds: ${DEADLINE}
  ttlSecondsAfterFinished: 86400 # holder가 끝난 뒤부터 센다(우리 설정값)
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6 # allow-vpc-http의 k6 podSelector, 주입기의 k6 제외(PR #11)와 맞춘다
        chaos/run-id: "${RUN_ID}"
      annotations: ${DISRUPT_ANNOTATION}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      affinity: ${ANTI_AFFINITY}
      containers:
        - name: k6
          image: ${K6_IMAGE}
          args: ["run", "--log-format=raw", "--console-output=/out/orders.jsonl", "/scripts/orders.js"]
          env:
            - {name: RUN_ID, value: "${RUN_ID}"}
            - {name: ORDER_API, value: "http://order.exchange.svc.cluster.local:8000"}
            - {name: OUT_DIR, value: "/out"}
            - {name: PROFILE, value: "${PROFILE}"}
            - {name: ACCOUNTS, value: "${ACCOUNTS}"}
            - {name: USER_BASE, value: "${USER_BASE}"}
            - {name: RATE, value: "${RATE}"}
            - {name: DURATION_S, value: "${DURATION_S}"}
            - {name: SPIKE_AT_S, value: "${SPIKE_AT_S}"}
            - {name: THRESHOLDS, value: "${THRESHOLDS}"}
            - {name: RUN_SEED, value: "${RUN_SEED}"}
          resources: # 우리 설정값. 100 VU 실측 뒤 조정(설계 4.8)
            requests: {cpu: 300m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: out, mountPath: /out}
        - name: holder
          image: ${K6_IMAGE}
          command: ["sh", "/scripts/hold.sh"]
          env:
            - {name: HOLD_S, value: "${HOLD_S}"}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: out, mountPath: /out}
      volumes:
        - name: scripts
          configMap: {name: k6-scripts}
        - name: out
          emptyDir: {sizeLimit: 2Gi}
