{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: adapter
  labels:
    {{- include "adapter.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "adapter.labels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics/
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
