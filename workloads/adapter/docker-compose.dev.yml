# 기존 kind DB와 분리된 adapter 개발/통합 테스트용 PostgreSQL.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adapter
      POSTGRES_PASSWORD: adapter
      POSTGRES_DB: adapter
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - adapter-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adapter -d adapter"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  adapter-data:
